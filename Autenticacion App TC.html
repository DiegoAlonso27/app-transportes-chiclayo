<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-family);background:var(--gray-100);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#app{display:flex;align-items:center;gap:28px;zoom:1}
@media (max-height:940px){#app{zoom:.92}}
@media (max-height:860px){#app{zoom:.84}}
@media (max-height:780px){#app{zoom:.76}}
button{font-family:var(--font-family);background:none;border:none;cursor:pointer;color:inherit}
a{color:var(--color-primary);text-decoration:none}a:hover{color:var(--cinnabar-700)}
.device{width:390px;height:844px;border:8px solid #0a0b0b;border-radius:44px;overflow:hidden;box-shadow:var(--shadow-5);flex-shrink:0;background:var(--color-background)}
@media (max-width:480px) and (pointer:coarse){html,body{height:100%}body{padding:0;margin:0;min-height:100vh;min-height:100dvh;height:100vh;height:100dvh;overflow:hidden;background:var(--color-background)}.device{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none;zoom:1!important}}
#phone-root{position:relative;height:100%;overflow:hidden}
#sheet-host{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheet-host>*{pointer-events:auto}
.scr-aut .toast{position:absolute;left:16px;right:16px;bottom:28px;z-index:60;display:flex;align-items:center;gap:8px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--gray-900);color:#fff;font-size:var(--label-large-size);box-shadow:var(--shadow-3)}
.panel{width:300px;max-height:844px;overflow-y:auto;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-1);padding:20px 16px}
.panel-h h1{font-size:var(--title-large-size);font-weight:700;letter-spacing:-.2px}
.panel-h p{margin-top:6px;font-size:var(--label-small-size);line-height:1.5;color:var(--text-tertiary);text-wrap:pretty}
.panel-g{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.panel-g h2{font-size:var(--label-small-size);font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--text-tertiary);padding:0 4px 6px}
.panel-b{text-align:left;padding:9px 10px;border-radius:var(--radius-xs);font-size:var(--label-large-size);color:var(--text-secondary);min-height:40px}
.panel-b:hover{background:var(--gray-100)}
.panel-b.on{background:var(--color-primary-light);color:var(--color-primary);font-weight:700}
.panel-nota{margin-top:24px;padding:12px;border-radius:var(--radius-sm);background:var(--gray-100);font-size:var(--label-small-size);line-height:1.5;color:var(--text-tertiary)}
.panel-nota b{color:var(--text-secondary)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
